name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Resources
        run: python3 tools/check_resources.py
      - name: Build and verify
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-and-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            core/build/reports/
