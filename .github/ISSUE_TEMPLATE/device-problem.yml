name: Problem report / 问题反馈
description: Report connection, workout or interface problems in OpenMOBI.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        请在 OpenMOBI「设置 → 设备诊断」保持协议报文记录开启，复现后及时导出日志。报文自动清理，分享前请检查可能含运动和心率值的内容；界面问题可以只附截图。
        Keep protocol recording enabled under Settings → Device diagnostics, reproduce the issue and export promptly. Logs rotate automatically and may contain live movement and heart-rate values. Review before sharing. For interface issues, screenshots may suffice.
  - type: input
    id: equipment
    attributes:
      label: Equipment model / 器材型号
      description: Product or label model; use N/A for interface-only issues. Do not include a Bluetooth address or serial number.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version, phone/tablet model, Android version / 测试环境
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Steps, expected behavior, actual behavior / 复现与结果
      description: Include whether it occurs in full-screen or floating mode; note last working app version if known.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Exported log and optional screenshots / 日志与截图
      description: Drag OpenMOBI-diagnostics.txt here. Do not post keys, official APKs, or private workout backups.
